      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <clipPath id="clip"><rect width="590" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
<rect x="0" y="0" width="590" height="300" rx="18" fill="url(#card)"/><rect x="0" y="0" width="590" height="300" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="588.5" height="298.5" rx="17.5" fill="none" stroke="#418adc" stroke-opacity="0.35" stroke-width="1.5"/>
<circle cx="550" cy="40" r="200" fill="url(#glow)"/>
<rect x="430" y="116" width="16" height="34" rx="4" fill="#7cd4ff" fill-opacity="0.12"/><rect x="456" y="98" width="16" height="52" rx="4" fill="#7cd4ff" fill-opacity="0.16999999999999998"/><rect x="482" y="106" width="16" height="44" rx="4" fill="#7cd4ff" fill-opacity="0.22"/><rect x="508" y="80" width="16" height="70" rx="4" fill="#7cd4ff" fill-opacity="0.27"/><rect x="534" y="88" width="16" height="62" rx="4" fill="#7cd4ff" fill-opacity="0.32"/><rect x="560" y="58" width="16" height="92" rx="4" fill="#7cd4ff" fill-opacity="0.37"/>
<text class="mono" x="36" y="62" font-size="16" letter-spacing="2.5" fill="#7cd4ff">APP · FINANZAS PERSONALES</text>
<text class="sans" x="34" y="112" font-size="40" font-weight="800" fill="url(#txt)">Mis Finanzas IS</text>
<text class="sans" x="36" y="158" font-size="21" fill="#d6ecff" fill-opacity="0.85">Cuentas, movimientos, pagos periódicos</text><text class="sans" x="36" y="189" font-size="21" fill="#d6ecff" fill-opacity="0.85">y reportes en un solo lugar.</text>
<rect x="36" y="228" width="52" height="38" rx="19" fill="#418adc" fill-opacity="0.2" stroke="#7cd4ff" stroke-opacity="0.35"/><text class="sans" x="62" y="253" text-anchor="middle" font-size="18" font-weight="600" fill="#d6ecff">Web</text>
<rect x="97.6" y="228" width="52" height="38" rx="19" fill="#418adc" fill-opacity="0.2" stroke="#7cd4ff" stroke-opacity="0.35"/><text class="sans" x="123" y="253" text-anchor="middle" font-size="18" font-weight="600" fill="#d6ecff">iOS</text>
<rect x="159.2" y="228" width="96" height="38" rx="19" fill="#418adc" fill-opacity="0.2" stroke="#7cd4ff" stroke-opacity="0.35"/><text class="sans" x="207" y="253" text-anchor="middle" font-size="18" font-weight="600" fill="#d6ecff">Android</text>
<text class="sans" x="554" y="254" text-anchor="end" font-size="26" fill="#7cd4ff">→</text>
