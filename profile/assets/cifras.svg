<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Desde 1999, +19 años con Intelisis ERP, 3 plataformas, servicio en 32 estados">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062646"/>
      <stop offset="1" stop-color="#0b3b6b"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a33"/>
      <stop offset="0.55" stop-color="#003462"/>
      <stop offset="1" stop-color="#0a4d8c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#418adc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#418adc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <clipPath id="clip"><rect width="1200" height="170" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
<rect width="1200" height="170" rx="18" fill="url(#bg)"/>
<rect width="1200" height="170" rx="18" fill="url(#dots)"/>
<circle cx="1050" cy="20" r="220" fill="url(#glow)"/>
<text class="sans" x="150.0" y="96" text-anchor="middle" font-size="56" font-weight="800" fill="url(#txt)">1999</text>
<text class="sans" x="150.0" y="132" text-anchor="middle" font-size="20" fill="#d6ecff" fill-opacity="0.85">año de fundación</text>
<line x1="300.0" y1="44" x2="300.0" y2="126" stroke="#9fdcff" stroke-opacity="0.22" stroke-width="2"/>
<text class="sans" x="450.0" y="96" text-anchor="middle" font-size="56" font-weight="800" fill="url(#txt)">+19</text>
<text class="sans" x="450.0" y="132" text-anchor="middle" font-size="20" fill="#d6ecff" fill-opacity="0.85">años con Intelisis ERP</text>
<line x1="600.0" y1="44" x2="600.0" y2="126" stroke="#9fdcff" stroke-opacity="0.22" stroke-width="2"/>
<text class="sans" x="750.0" y="96" text-anchor="middle" font-size="56" font-weight="800" fill="url(#txt)">3</text>
<text class="sans" x="750.0" y="132" text-anchor="middle" font-size="20" fill="#d6ecff" fill-opacity="0.85">plataformas: iOS, Android, web</text>
<line x1="900.0" y1="44" x2="900.0" y2="126" stroke="#9fdcff" stroke-opacity="0.22" stroke-width="2"/>
<text class="sans" x="1050.0" y="96" text-anchor="middle" font-size="56" font-weight="800" fill="url(#txt)">32</text>
<text class="sans" x="1050.0" y="132" text-anchor="middle" font-size="20" fill="#d6ecff" fill-opacity="0.85">estados con servicio</text>
  </g>
</svg>
